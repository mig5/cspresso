name: CI

on:
  push:

jobs:
  test:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-venv pipx

      - name: Install Poetry
        run: |
          pipx install poetry==2.5.1
          /root/.local/bin/poetry --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install project deps (including test extras)
        run: |
          poetry check --lock --strict
          poetry sync --with dev --no-interaction

      - name: Run test script
        # These tests serve trusted loopback fixtures in the disposable Docker
        # runner. Production CLI scans retain sandboxing by default. Prefer a
        # non-root, sandbox-capable runner and remove this override when available.
        env:
          CSPRESSO_TEST_NO_SANDBOX: "1"
        run: |
          ./tests.sh

      # Notify if any previous step in this job failed
      - name: Notify on failure
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.NODERED_WEBHOOK_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          RUN_NUMBER: ${{ forgejo.run_number }}
          SERVER_URL: ${{ forgejo.server_url }}
        run: |
          curl -X POST \
               -H "Content-Type: application/json" \
               -d "{\"repository\":\"$REPOSITORY\",\"run_number\":\"$RUN_NUMBER\",\"status\":\"failure\",\"url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_NUMBER\"}" \
               "$WEBHOOK_URL"
